[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-exam"
version = "0.0.0"
description = "Eval framework for agent skills, across Claude Code, Codex CLI, Copilot CLI and OpenCode"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Mikhail Korobov" }]
keywords = ["agent", "claude-code", "codex", "eval", "llm", "skills"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "claude-measure-usage>=0.1.0",
    "click>=8.1",
    "pydantic>=2.1",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[project.urls]
Documentation = "https://agent-exam.readthedocs.io"
Source = "https://github.com/zytedata/agent-exam"
Changelog = "https://github.com/zytedata/agent-exam/blob/main/CHANGES.rst"

[project.scripts]
agent-exam = "agent_exam.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agent_exam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff.lint]
extend-select = [
    # flake8-builtins
    "A",
    # flake8-async
    "ASYNC",
    # flake8-bugbear
    "B",
    # flake8-comprehensions
    "C4",
    # flake8-commas
    "COM",
    # pydocstyle
    "D",
    # flake8-future-annotations
    "FA",
    # flynt
    "FLY",
    # refurb
    "FURB",
    # isort
    "I",
    # flake8-implicit-str-concat
    "ISC",
    # flake8-logging
    "LOG",
    # Perflint
    "PERF",
    # pygrep-hooks
    "PGH",
    # flake8-pie
    "PIE",
    # pylint
    "PL",
    # flake8-pytest-style
    "PT",
    # flake8-use-pathlib
    "PTH",
    # flake8-pyi
    "PYI",
    # flake8-quotes
    "Q",
    # flake8-return
    "RET",
    # flake8-raise
    "RSE",
    # Ruff-specific rules
    "RUF",
    # flake8-bandit
    "S",
    # flake8-simplify
    "SIM",
    # flake8-slots
    "SLOT",
    # flake8-debugger
    "T10",
    # flake8-type-checking
    "TC",
    # pyupgrade
    "UP",
    # pycodestyle warnings
    "W",
    # flake8-2020
    "YTT",
]
ignore = [
    # Trailing comma missing
    "COM812",
    # Missing docstring in public module
    "D100",
    # Missing docstring in public class
    "D101",
    # Missing docstring in public method
    "D102",
    # Missing docstring in public function
    "D103",
    # Missing docstring in public package
    "D104",
    # Missing docstring in magic method
    "D105",
    # Missing docstring in __init__
    "D107",
    # One-line docstring should fit on one line
    "D200",
    # No blank lines allowed after function docstring
    "D202",
    # 1 blank line required between summary line and description
    "D205",
    # Multi-line docstring closing quotes should be on a separate line
    "D209",
    # First line should end with a period
    "D400",
    # First line of docstring should be in imperative mood
    "D401",
    # First line should not be the function's signature
    "D402",
    # try-except within a loop incurs performance overhead
    "PERF203",
    # Too many return statements
    "PLR0911",
    # Too many branches
    "PLR0912",
    # Too many arguments in function definition
    "PLR0913",
    # Too many statements
    "PLR0915",
    # Magic value used in comparison
    "PLR2004",
    # String contains ambiguous character
    "RUF001",
    # Docstring contains ambiguous character
    "RUF002",
    # Comment contains ambiguous character
    "RUF003",
    # Mutable class attributes should be annotated with typing.ClassVar
    "RUF012",
    # Use of assert detected
    "S101",

    # Deviations from the shared rule set, specific to this code base:

    # Do not catch blind exception. Provider subprocesses and judge calls
    # fail in ways the harnesses do not document; a broad catch that records
    # the failure on the attempt is the intended behavior.
    "BLE001",
    # `import` should be at the top-level of a file. Several imports are
    # deferred on purpose, to break import cycles between the provider
    # registry and the modules it loads.
    "PLC0415",
    # Too many positional arguments. The provider interface is positional by
    # design so that adapters stay drop-in replaceable.
    "PLR0917",
    # Prefer TypeError for invalid type. Pydantic turns ValueError into a
    # ValidationError and lets TypeError escape, so validators must raise
    # ValueError even when the problem is the value's type.
    "TRY004",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
# Spawning an agent CLI resolved from PATH is what a provider does; the
# command is assembled from config, never from agent output.
"agent_exam/providers/*" = ["S603", "S607"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic and dataclasses resolve annotations at run time, so their fields
# must keep their imports outside `TYPE_CHECKING`.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "agent_exam._models._StrictModel",
]
runtime-evaluated-decorators = ["dataclasses.dataclass"]

[tool.bumpversion]
commit = true
tag = true
tag_name = "{new_version}"

[[tool.bumpversion.files]]
filename = "CHANGES.rst"
search = "\\(unreleased\\)$"
replace = "({now:%Y-%m-%d})"
regex = true

[[tool.bumpversion.files]]
filename = "docs/conf.py"
