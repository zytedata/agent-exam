[tox]
requires =
    tox>=4.25
    sphinx-scrapy[tox] @ git+https://github.com/scrapy/sphinx-scrapy.git@0.8.10
envlist = pre-commit,min,py3{10-14},docs,twinecheck

[testenv]
deps =
    pytest
commands =
    pytest {posargs:tests}

[testenv:min]
basepython = python3.10
deps =
    {[testenv]deps}
    claude-measure-usage==0.1.0
    click==8.1
    pydantic==2.1
    pyyaml==6.0
    tomli==2.0

[testenv:pre-commit]
deps = pre-commit
commands = pre-commit run --all-files --show-diff-on-failure
skip_install = true

[testenv:twinecheck]
basepython = python3
deps =
    twine==7.0.0
    build==1.5.0
commands =
    python -m build --sdist
    twine check dist/*
